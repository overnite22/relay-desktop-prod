[package]
name = "relay-desktop-core"
description = "Data sources (local vault, Relay server) for the Relay desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
roxmltree = "0.21"
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sha1 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
