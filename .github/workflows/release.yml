name: Release
# Copied into relay-desktop-prod by scripts/publish-prod.sh. Builds the MSI
# from the public source and publishes the GitHub release used by the
# in-app updater (Relay-X.Y.Z-x64.msi + SHA256SUMS).
on:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test -p relay-desktop-core --locked

  msi:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Version
        id: version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            test "${GITHUB_REF_NAME#desktop-v}" = "$v" || { echo "tag ${GITHUB_REF_NAME} != Cargo version $v"; exit 1; }
          fi
      - name: Lint, test and build
        run: |
          cargo clippy -p relay-desktop --locked -- -D warnings
          cargo test -p relay-desktop --locked
          cargo build --release -p relay-desktop --locked
      - name: Check runtime dependencies
        run: |
          exe=target/release/relay-desktop.exe
          if grep -aqiE 'vcruntime140|msvcp140|api-ms-win-crt' "$exe"; then
            echo "relay-desktop.exe depends on the Visual C++ runtime"; exit 1
          fi
      - name: Build MSI (WiX)
        working-directory: app/wix
        run: |
          dotnet tool install --global wix --version 5.0.2
          mkdir -p "$GITHUB_WORKSPACE/dist"
          wix build Relay.wxs -arch x64 -d Version=${{ steps.version.outputs.version }} \
            -d ExePath="$(cygpath -w "$GITHUB_WORKSPACE/target/release/relay-desktop.exe")" \
            -o "$(cygpath -w "$GITHUB_WORKSPACE/dist/Relay-${{ steps.version.outputs.version }}-x64.msi")"
          cd "$GITHUB_WORKSPACE/dist" && sha256sum *.msi | tee SHA256SUMS
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-desktop-unsigned
          path: dist/*
          if-no-files-found: error

  sign:
    needs: msi
    if: startsWith(github.ref, 'refs/tags/desktop-v') && vars.SIGNPATH_PROJECT_SLUG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'msi' }}
          github-artifact-id: ${{ needs.msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Checksums of the signed package
        run: cd signed && sha256sum *.msi > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-desktop-signed
          path: signed/*
          if-no-files-found: error

  publish:
    needs: [msi, sign]
    if: always() && needs.msi.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Signed package
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-desktop-signed
          path: out
      - name: Unsigned package
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-desktop-unsigned
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          v="${GITHUB_REF_NAME#desktop-v}"
          test -f "Relay-$v-x64.msi"
          sha256sum "Relay-$v-x64.msi" > SHA256SUMS
          notes=../RELEASE_NOTES.md; test -f "$notes" || { echo "Relay Desktop $v" > notes.md; notes=notes.md; }
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Relay Desktop $v" --notes-file "$notes" "Relay-$v-x64.msi" SHA256SUMS
